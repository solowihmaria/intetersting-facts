<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" href="./assets/did-you-know.png" />
    <title>Interesting facts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Allura&family=Bagel+Fat+One&family=Chicle&family=Coiny&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Press+Start+2P&family=Rubik+Bubbles&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="header-logo">
        <img src="assets/fun-fact.png" alt="Fun fact" class="header-icon" />
        <h2 class="header-title">Мини-энциклопедия необычных фактов</h2>
      </div>
    </header>

    <main class="main">
      <h1 class="main-tittle">Хотие узнаь больше интересных фактов? Вперёд!</h1>
      <div class="facts-container">
        <h2 class="facts-title">Выберите интересующие категории:</h2>
        <select name="facts" class="facts-select">
          <option value="cosmos">Космос</option>
          <option value="ocean">Море</option>
          <option value="psychology">Психология</option>
          <option value="animals">Животные</option>
        </select>
        <div class="facts">
          <img src="./assets/space.png" alt="fact-img" class="fact-img" />
          <p class="fact-text">
            На Венере день длиннее, чем год: планета вращается вокруг своей оси
            медленнее, чем вокруг Солнца.
          </p>
          <div class="fact-controls">
            <button class="prev-fact">←</button>
            <button class="next-fact">→</button>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p class="footer-title">Класс, теперь вы гений</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
